plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.compass_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.compass_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Patrol: run Dart tests through Patrol's JUnit runner. The Orchestrator
        // (below) gives each test a fresh app process.
        //
        // clearPackageData is intentionally NOT set. Its `pm clear` between
        // tests could run while the previous test's process was still dying,
        // leave that task half-removed, and the system's "Destroy timeout of
        // remove-task" then killed the NEXT test's new process ("Test
        // instrumentation process crashed" in CI). The local-data
        // configuration the tests use persists nothing to disk, so a fresh
        // process already gives a clean state. Revisit if tests start using
        // SharedPreferences (e.g. the remote/staging configuration).
        testInstrumentationRunner "pl.leancode.patrol.PatrolJUnitRunner"
    }

    // Patrol: Android Test Orchestrator runs every test in its own instrumentation.
    testOptions {
        execution "ANDROIDX_TEST_ORCHESTRATOR"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
        debug {
            // Patrol: keep test classes intact (no R8 shrinking in test builds).
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    androidTestUtil "androidx.test:orchestrator:1.5.1"
}

flutter {
    source = "../.."
}
